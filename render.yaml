services:
  - type: web
    name: bento-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROUP_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BASE_URL
        sync: false
      - key: DELIVERY_FEE
        value: "15000"
      - key: FREE_DELIVERY_FROM
        value: "3"
      - key: ORDER_START
        value: "09:00"
      - key: ORDER_END
        value: "12:00"
